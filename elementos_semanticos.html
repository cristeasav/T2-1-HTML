<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peli fav con elementos semánticos</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
header {
  background-color: #666;
  padding: 30px;
  text-align: center;
  font-size: 35px;
  color: white;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 30%;
  height: 300px; /* only for demonstration, should be removed */
  background: #ccc;
  padding: 20px;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 20px;
  width: 70%;
  background-color: #f1f1f1;
  height: 300px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Style the footer */
footer {
  background-color: #777;
  padding: 10px;
  text-align: center;
  color: white;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>
  <header>
  <h1>Titol peli</h1>
</header>
  <h2>Director y noquemas...</h2>
  <ul>
    <li>Actor1</li>
    <li>Actor2</li>
    <li>Actor3</li>
  </ul>
  <p>Descripció de la peli</p>
  <p>Més descripcio <strong>hola</strong> hola <em>jkkk</em> mm <mark>marl</mark></p>
  <a href="https://www.w3schools.com">Enllaç a IMDB</a>
  <a href="https://www.w3schools.com">Enllaç a Trailer</a>
  <img src="https://www.w3schools.com/html/img_chania.jpg" alt="chania">
</body>
</html>
